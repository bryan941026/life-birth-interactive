<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>燈｜星河對話</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="chat-panel" aria-label="燈的聊天頁面">
      <header class="chat-header">
        <div class="identity">
          <div class="avatar" aria-hidden="true">
            <span>燈</span>
          </div>
          <div class="title-block">
            <p class="kicker">溫柔陪伴・知識相談・樂團主唱</p>
            <h1>燈</h1>
          </div>
        </div>
        <div class="status-pill" aria-label="目前在線">
          <span class="status-dot" aria-hidden="true"></span>
          <span>在線</span>
        </div>
      </header>

      <section class="presence" aria-label="角色介紹">
        <div class="presence-copy">
          <p class="overline">STARLIGHT CONVERSATION</p>
          <p>燈會用安靜、穩定的語氣陪你說話。你可以談心，也可以問學科、生活、創作與世界上的許多事。</p>
        </div>
        <div class="keepsakes" aria-label="擅長領域">
          <span>溫柔安慰</span>
          <span>學科知識</span>
          <span>音樂創作</span>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite" aria-label="對話紀錄"></section>

      <form id="chat-form" class="composer" autocomplete="off">
        <label class="sr-only" for="message-input">輸入訊息</label>
        <textarea id="message-input" name="message" rows="1" placeholder="把想說的話交給燈..." maxlength="4000"></textarea>
        <div class="composer-actions">
          <button id="voice-button" class="icon-button" type="button" aria-label="語音輸入" title="語音輸入">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"></path>
              <path d="M19 11a7 7 0 0 1-14 0"></path>
              <path d="M12 18v3"></path>
              <path d="M8 21h8"></path>
            </svg>
          </button>
          <button id="send-button" class="send-button" type="submit">
            <span>送出</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4Z"></path>
              <path d="M22 2 11 13"></path>
            </svg>
          </button>
        </div>
      </form>
    </section>
  </main>

  <template id="message-template">
    <article class="message">
      <div class="bubble">
        <p class="message-text"></p>
        <time class="message-time"></time>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
