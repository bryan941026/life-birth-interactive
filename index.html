<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11172d">
  <title>燈｜對話</title>
  <style>
    :root{--bg:#090d1c;--ink:#f7f8ff;--dark:#182033;--soft:#b9c2dd;--muted:#69718e;--line:rgba(255,255,255,.15);--user:#e8eefc;--bot:rgba(255,255,255,.93);--rose:#f7c7d6;--shadow:0 30px 80px rgba(0,0,0,.34)}*{box-sizing:border-box}html{min-height:100%}body{min-height:100vh;margin:0;color:var(--ink);background:radial-gradient(circle at 16% 12%,rgba(143,199,255,.2),transparent 28%),radial-gradient(circle at 80% 20%,rgba(203,183,255,.25),transparent 24%),linear-gradient(rgba(8,11,27,.66),rgba(8,11,27,.9)),url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=2200&q=85") center/cover fixed,#090d1c;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}body:before{position:fixed;inset:0;pointer-events:none;content:"";background-image:radial-gradient(circle at 15% 20%,rgba(255,255,255,.9) 0 1px,transparent 1px),radial-gradient(circle at 75% 18%,rgba(203,183,255,.7) 0 1px,transparent 1px),radial-gradient(circle at 42% 72%,rgba(143,199,255,.75) 0 1px,transparent 1px);background-size:180px 180px,230px 230px,260px 260px;opacity:.48}button,textarea{font:inherit}button{cursor:pointer}.app-shell{position:relative;z-index:1;width:min(1120px,calc(100% - 28px));min-height:100vh;display:grid;place-items:center;margin:0 auto;padding:28px 0}.chat-panel{width:min(100%,960px);height:min(860px,calc(100vh - 56px));min-height:620px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(18,24,47,.84),rgba(11,15,32,.9));box-shadow:var(--shadow);backdrop-filter:blur(18px)}.chat-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:22px 24px 18px;border-bottom:1px solid var(--line)}.identity{min-width:0;display:flex;align-items:center;gap:14px}.avatar{width:54px;height:54px;display:grid;flex:0 0 auto;place-items:center;border:1px solid rgba(255,255,255,.24);border-radius:18px;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.95),rgba(203,183,255,.72) 34%,rgba(78,105,171,.9) 72%);box-shadow:0 14px 32px rgba(120,140,255,.22)}.avatar span{color:#171d32;font-size:20px;font-weight:900}.kicker,.overline,.presence p,h1{margin:0;letter-spacing:0}.kicker,.overline{color:var(--soft);font-size:13px;font-weight:700}h1{margin-top:2px;color:#fff;font-size:32px;line-height:1.1}.status-pill{min-height:36px;display:inline-flex;align-items:center;gap:8px;flex:0 0 auto;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.08);color:var(--soft);font-size:14px;font-weight:700}.status-dot{width:8px;height:8px;border-radius:50%;background:#9ee8c9;box-shadow:0 0 14px rgba(158,232,201,.8)}.presence{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.045)}.presence-copy{min-width:0;display:grid;gap:8px}.presence p:last-child{max-width:720px;color:rgba(247,248,255,.92);font-size:16px;line-height:1.65}.keepsakes{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.keepsakes span{min-height:32px;display:inline-flex;align-items:center;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:6px 10px;background:rgba(255,255,255,.08);color:var(--soft);font-size:13px;font-weight:700;white-space:nowrap}.messages{display:flex;flex-direction:column;gap:14px;overflow-y:auto;padding:24px;scroll-behavior:smooth}.messages::-webkit-scrollbar{width:10px}.messages::-webkit-scrollbar-thumb{border:3px solid transparent;border-radius:999px;background:rgba(255,255,255,.26);background-clip:content-box}.message{display:flex;max-width:min(76%,720px)}.message.bot{align-self:flex-start}.message.user{align-self:flex-end}.bubble{border:1px solid rgba(23,33,58,.12);border-radius:22px;padding:13px 15px 10px;box-shadow:0 14px 34px rgba(0,0,0,.14)}.message.bot .bubble{border-top-left-radius:10px;background:var(--bot);color:var(--dark)}.message.user .bubble{border-top-right-radius:10px;background:linear-gradient(135deg,var(--user),#fff);color:var(--dark)}.message.pending .message-text:after{display:inline-block;width:1.2em;content:"...";animation:pulse 1.2s infinite}.message-text{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.72}.message-time{display:block;margin-top:8px;color:var(--muted);font-size:12px;font-weight:700;text-align:right}.composer{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;padding:18px 20px 20px;border-top:1px solid var(--line);background:rgba(6,9,22,.48)}textarea{width:100%;max-height:150px;min-height:52px;overflow-y:hidden;resize:none;border:1px solid rgba(255,255,255,.18);border-radius:22px;padding:14px 16px;color:var(--ink);background:rgba(255,255,255,.09);outline:none;line-height:1.55}textarea::placeholder{color:rgba(225,230,249,.6)}textarea:focus{border-color:rgba(143,199,255,.62);box-shadow:0 0 0 4px rgba(143,199,255,.12)}.composer-actions{display:flex;align-items:center;gap:10px}.icon-button,.send-button{min-height:52px;border:0;border-radius:18px;color:#11172d;transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease}.icon-button{width:52px;display:grid;place-items:center;background:rgba(255,255,255,.9)}.icon-button.listening{background:var(--rose);box-shadow:0 0 0 5px rgba(247,199,214,.18)}.send-button{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:0 18px;background:linear-gradient(135deg,#d9ccff,#a9d8ff);font-weight:900}.icon-button:hover,.send-button:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,0,0,.22)}.icon-button:disabled,.send-button:disabled{cursor:wait;opacity:.62;transform:none;box-shadow:none}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:2}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media (max-width:760px){.app-shell{width:100%;padding:0}.chat-panel{width:100%;height:100vh;min-height:100vh;border-width:0;border-radius:0}.chat-header,.presence,.messages{padding-left:16px;padding-right:16px}.presence{grid-template-columns:1fr}.keepsakes{justify-content:flex-start}.message{max-width:88%}.composer{grid-template-columns:1fr;padding:14px}.composer-actions{justify-content:space-between}.send-button{flex:1}}
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="chat-panel" aria-label="與燈對話">
      <header class="chat-header">
        <div class="identity">
          <div class="avatar" aria-hidden="true">
            <span>燈</span>
          </div>
          <div>
            <p class="kicker">溫柔陪伴與知識對話</p>
            <h1>燈</h1>
          </div>
        </div>
        <div class="status-pill" aria-label="目前狀態">
          <span class="status-dot" aria-hidden="true"></span>
          <span>可以對話</span>
        </div>
      </header>

      <section class="presence" aria-label="燈的簡介">
        <div class="presence-copy">
          <p class="overline">主唱 · 學科知識 · 安靜陪伴</p>
          <p>
            我是燈。你可以把想說的事情慢慢放下來，我會安靜聽你說，也會用清楚的方式陪你整理問題。
          </p>
        </div>
        <div class="keepsakes" aria-label="燈喜歡的事物">
          <span>企鵝</span>
          <span>石頭收藏</span>
          <span>星夜</span>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite" aria-label="對話內容"></section>

      <form id="chat-form" class="composer" autocomplete="off">
        <label class="sr-only" for="message-input">輸入訊息</label>
        <textarea id="message-input" name="message" rows="1" placeholder="和燈說說話..." maxlength="4000"></textarea>
        <div class="composer-actions">
          <button id="voice-button" class="icon-button" type="button" aria-label="語音輸入" title="語音輸入">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z"></path>
              <path d="M19 11a7 7 0 0 1-14 0"></path>
              <path d="M12 18v3"></path>
              <path d="M8 21h8"></path>
            </svg>
          </button>
          <button id="send-button" class="send-button" type="submit">
            <span>送出</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4Z"></path>
              <path d="M22 2 11 13"></path>
            </svg>
          </button>
        </div>
      </form>
    </section>
  </main>

  <template id="message-template">
    <article class="message">
      <div class="bubble">
        <p class="message-text"></p>
        <time class="message-time"></time>
      </div>
    </article>
  </template>

  <script src="script.js"></script>
</body>
</html>
